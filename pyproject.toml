[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-red-team-harness"
version = "0.1.0"
description = "A red-team harness for testing AI agent security"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6,<1.0",
    "PyMuPDF>=1.28,<2.0",
    "chromadb>=1.5.3,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pre-commit>=4,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "targets*"]
